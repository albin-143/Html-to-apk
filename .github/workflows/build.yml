name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip template
        run: unzip -q html-to-apk.zip
      - name: Use my index.html if present
        run: |
          if [ -f index.html ]; then
            cp index.html html-to-apk/app/src/main/assets/index.html
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug
        working-directory: html-to-apk
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: html-to-apk/app/build/outputs/apk/debug/*.apk
